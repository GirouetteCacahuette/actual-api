services:
  actual_server:
    image: docker.io/actualbudget/actual-server:26.3.0-alpine
    ports:
      # Actual is available on port ACTUAL_SERVER_PORT (default 6318) of the device you run the server on.
      - '${ACTUAL_SERVER_PORT:-6318}:5006'
    # environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/umbrel.tail1bd6b.ts.net.key
      # - ACTUAL_HTTPS_CERT=/data/umbrel.tail1bd6b.ts.net.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - server:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
  actual_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${ACTUAL_API_PORT:-6319}:3000'
    environment:
      - 'ACTUAL_SERVER_URL=http://actual_server:5006'
      - 'ACTUAL_PASSWORD=${ACTUAL_PASSWORD}'
      - 'ACTUAL_SYNC_ID=${ACTUAL_SYNC_ID}'
      - 'ACTUAL_BUDGET_ENCRYPTION_KEY=${ACTUAL_BUDGET_ENCRYPTION_KEY}'
      - 'ACTUAL_DATA_DIR=/app/data'
    volumes:
      - api:/app/data
volumes:
  server:
  api:
